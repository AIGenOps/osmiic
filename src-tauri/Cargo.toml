[package]
name = "osmiic-downloader"
version = "1.0.0"
description = "OSMIIC - Cross-Platform yt-dlp Music & Video Downloader with Language Categorization"
authors = ["OSMIIC Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", default-features = false }

[dependencies]
tauri = { version = "2.0", default-features = false, features = ["wry"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
regex = "1.10"
walkdir = "2.5"
dirs = "5.0"
ureq = { version = "2.9", features = ["json"] }

[features]
default = ["custom-protocol"]
custom-protocol = []
